<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Myths of Moonrise</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <div class="row mt-2">
            <div class="col-12 d-flex mt-1">
                <img src="64.png" class="" alt="Logo">
                <div class="flex-grow-1">
                    <h3 class="ms-3">Myths of Moonrise</h3>
                    <hr>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-auto mx-auto">
                <div class="row">
                    <div class="col-12">
                        <h5 class="text-center">Событие "Святая и Кристаллы"</h5>
                        <div class="input-group mt-3">
                            <span class="input-group-text">Очки события</span>
                            <input id="out-res" class="form-control" type="text" readonly>
                        </div>
                        <p class="text-body-tertiary">На будущее:<br>добавить подсчет очков за кристаллы и показывать стоимость их покупки</p>
                    </div>
                </div>
                <div class="row mt-2">
                    <div class="col-6">
                        <div class="mt-3">
                            <h6 class="text-center">Дары Войны</h6>
                        </div>
                        <div class="input-group mt-3">
                            <span class="input-group-text w-25">100</span>
                            <input id="inp-war1" class="form-control" type="number" min="0">
                        </div>
                        <div class="input-group mt-3">
                            <span class="input-group-text w-25">500</span>
                            <input id="inp-war2" class="form-control" type="number" min="0">
                        </div>
                        <div class="input-group mt-3">
                            <span class="input-group-text w-25">2k</span>
                            <input id="inp-war3" class="form-control" type="number" min="0">
                        </div>
                        <div class="input-group mt-3">
                            <span class="input-group-text w-25">5k</span>
                            <input id="inp-war4" class="form-control" type="number" min="0">
                        </div>
                        <div class="input-group mt-3">
                            <span class="input-group-text w-25">10k</span>
                            <input id="inp-war5" class="form-control" type="number" min="0">
                        </div>
                        <div class="input-group mt-3">
                            <span class="input-group-text w-25">20k</span>
                            <input id="inp-war6" class="form-control" type="number" min="0">
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="mt-3">
                            <h6 class="text-center">Дары Развития</h6>
                        </div>
                        <div class="input-group mt-3">
                            <span class="input-group-text w-25">100</span>
                            <input id="inp-evo1" class="form-control" type="number" min="0">
                        </div>
                        <div class="input-group mt-3">
                            <span class="input-group-text w-25">500</span>
                            <input id="inp-evo2" class="form-control" type="number" min="0">
                        </div>
                        <div class="input-group mt-3">
                            <span class="input-group-text w-25">2k</span>
                            <input id="inp-evo3" class="form-control" type="number" min="0">
                        </div>
                        <div class="input-group mt-3">
                            <span class="input-group-text w-25">5k</span>
                            <input id="inp-evo4" class="form-control" type="number" min="0">
                        </div>
                        <div class="input-group mt-3">
                            <span class="input-group-text w-25">10k</span>
                            <input id="inp-evo5" class="form-control" type="number" min="0">
                        </div>
                        <div class="input-group mt-3">
                            <span class="input-group-text w-25">20k</span>
                            <input id="inp-evo6" class="form-control" type="number" min="0">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function(){
            function CalculatePoints(){
                const res = (
                    document.querySelector('#inp-war1').value * 100 +
                    document.querySelector('#inp-war2').value * 500 +
                    document.querySelector('#inp-war3').value * 2000 +
                    document.querySelector('#inp-war4').value * 5000 +
                    document.querySelector('#inp-war5').value * 10000 +
                    document.querySelector('#inp-war6').value * 20000 +
                    document.querySelector('#inp-evo1').value * 100 +
                    document.querySelector('#inp-evo2').value * 500 +
                    document.querySelector('#inp-evo3').value * 2000 +
                    document.querySelector('#inp-evo4').value * 5000 +
                    document.querySelector('#inp-evo5').value * 10000 +
                    document.querySelector('#inp-evo6').value * 20000
                ) / 5;
                document.querySelector('#out-res').value = res.toLocaleString('ru');
            }
            for(const el of document.querySelectorAll('input[type="number"]')){
                el.addEventListener('input', CalculatePoints);
            }
        });
    </script>
</body>
</html>
